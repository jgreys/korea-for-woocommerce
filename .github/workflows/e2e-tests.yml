name: E2E tests

on:
  pull_request:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.1', '8.4' ]
    name: E2E tests (PHP ${{ matrix.php-versions }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Configure wp-env
        run: |
          echo '{ "phpVersion": "${{ matrix.php-versions }}" }' > .wp-env.override.json

      - name: Setup wp-env
        run: npm run env:start

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-php-${{ matrix.php-versions }}
          path: artifacts
          if-no-files-found: ignore
